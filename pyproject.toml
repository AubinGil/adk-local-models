[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adk_local_models"
version = "0.1.0"
description = "A LiteLLM-free Google ADK adapter for local chat-completions servers"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["google-adk>=2.13.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
