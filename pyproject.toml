[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adk_local_models"
version = "0.1.1"
description = "A lightweight, direct Google ADK adapter for local OpenAI-compatible servers without LiteLLM or the OpenAI SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["google-adk>=2.13.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]
